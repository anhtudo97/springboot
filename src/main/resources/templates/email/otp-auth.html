<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Authentication</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td style="font-size:20px;font-weight:bold;color:#222222;">Verify your account</td>
                </tr>
                <tr>
                    <td style="padding:16px 0;font-size:14px;color:#555555;">
                        Use the one-time password below to complete your sign in.
                        It is valid for 5 minutes.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:16px 0;">
                        <span style="display:inline-block;padding:12px 24px;font-size:28px;letter-spacing:6px;
                                     font-weight:bold;color:#1a73e8;background:#e8f0fe;border-radius:6px;">{{otp}}</span>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:12px;color:#999999;">
                        If you did not request this code, you can ignore this email.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
