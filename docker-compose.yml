services:
  mysql:
    image: mysql:8.4
    container_name: springboot-demo
    restart: unless-stopped
    ports:
      - "33336:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: springboot_demo
      TZ: Asia/Bangkok
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - springboot-demo-data:/var/lib/mysql

volumes:
  springboot-demo-data:
